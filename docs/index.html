      <header>
        <div class="brand">ToneCraft</div>
        <h1>调音器与节拍器</h1>
        <p>ToneCraft 是乐器调音与节拍练习工具，包含 iOS、Android 客户端和微信小程序。</p>
      </header>

      <section class="card">
        <h2>功能</h2>
        <p><strong>调音器：</strong>实时识别音高，支持选择乐器与调弦方式。</p>
        <p><strong>节拍器：</strong>调整速度、拍号和节奏细分，辅助日常练习。</p>
      </section>

      <section class="card">
        <h2>Android 应用</h2>
        <p>在 Google Play 下载 ToneCraft。</p>

      </section>

      <section class="card">
        <h2>微信小程序</h2>
        <p>在微信中搜索“音匠节拍器”或“音匠调音器”即可使用。</p>
